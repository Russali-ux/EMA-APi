name: EMA/AEMPS ePI Monitor

on:
  workflow_dispatch: {}
  schedule:
    # Diario 07:00 UTC = 02:00 Lima. El piloto es pequeño (23 PI Lists
    # totales confirmadas en Fase 0), así que una corrida diaria es liviana.
    - cron: "0 7 * * *"

permissions:
  contents: write   # para commitear el snapshot JSON de respaldo

concurrency:
  group: ema-epi-monitor
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Si la API de la EMA responde 5xx / no responde, el scraper NO falla:
      # deja data/ema_epi_estado.json con estado=fuente_caida, emite un
      # ::warning:: y conserva el snapshot anterior. Solo falla por errores
      # nuestros (4xx, configuración, bugs).
      - name: Ejecutar scraper EMA/AEMPS ePI
        id: scraper
        env:
          EMA_EPI_BASE_URL: ${{ secrets.EMA_EPI_BASE_URL }}
          EMA_EPI_SUBSCRIPTION_KEY: ${{ secrets.EMA_EPI_SUBSCRIPTION_KEY }}
        run: python scripts/scraper_ema_epi.py

      # Siempre registra la corrida en ema_epi_corridas (también si la fuente
      # cayó); solo hace upsert de documentos/cambios cuando hubo datos.
      - name: Sincronizar con Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ema_epi_sync_supabase.py

      - name: Vincular con CIMA (nregistro)
        if: steps.scraper.outputs.fuente_ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ema_epi_vincular_cima.py

      - name: Commit snapshot JSON (respaldo)
        if: steps.scraper.outputs.fuente_ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ema_epi_data.json data/ema_epi_estado.json
          git diff --staged --quiet || git commit -m "chore: actualizar snapshot ePI EMA/AEMPS [skip ci]"
          git push
        continue-on-error: true
